<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Проверка анимации бабочки — референс JEFworks</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #2d2530;
      background:
        radial-gradient(circle at 50% 45%, rgba(184, 137, 207, .2), transparent 28rem),
        #fbfaf7;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { width: min(680px, 92vw); text-align: center; }
    h1 { margin: 0 0 .4rem; font: 500 clamp(24px, 4vw, 38px)/1.1 Georgia, serif; }
    p { margin: 0; color: #776d79; }
    .reference-stage {
      position: relative;
      height: 430px;
      display: grid;
      place-items: center;
      perspective: 800px;
      perspective-origin: 50% 45%;
    }
    .scale-wrap { transform: scale(2.35); transform-origin: 50% 50%; }

    /* Геометрия и 3D-анимация повторяют CodePen JEFworks/XzKJmv. */
    @keyframes left-wing-flap {
      0%, 100% { transform: translate3d(0,0,0) scaleX(1) rotate3d(0,1,0,60deg); }
      50% { transform: translate3d(0,0,0) scaleX(1) rotate3d(0,1,0,-70deg); }
    }
    @keyframes right-wing-flap {
      0%, 100% { transform: translate3d(0,0,0) scaleX(-1) rotate3d(0,1,0,60deg); }
      50% { transform: translate3d(0,0,0) scaleX(-1) rotate3d(0,1,0,-70deg); }
    }
    .butterfly_container {
      position: relative;
      width: 100px;
      height: 100px;
      transform-style: preserve-3d;
    }
    .butterfly_container var {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100px;
      height: 100px;
      margin: -50px 0 0 -50px;
      transform-style: preserve-3d;
    }
    .butterfly_container var.rotate3d {
      transform: rotate3d(1,.5,0,50deg);
    }
    figure.butterfly {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100px;
      height: 100px;
      margin: -50px 0 0 -50px;
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
    }
    .wing {
      position: absolute;
      width: 50px;
      height: 100px;
      transform-style: preserve-3d;
      transform-origin: 50px 50px;
      will-change: transform;
      backface-visibility: visible;
    }
    .wing.left { animation: left-wing-flap 1s ease-in-out infinite; }
    .wing.right { animation: right-wing-flap 1s ease-in-out infinite; }
    .wing use { display: block; transform-style: preserve-3d; }
    .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .credit { font-size: 13px; }
    .credit a { color: #8d4bad; }
    .spec {
      display: inline-flex;
      gap: 8px;
      margin-top: 4px;
      padding: 7px 11px;
      border: 1px solid #e3dce5;
      border-radius: 999px;
      color: #6d606f;
      font: 12px/1 system-ui, sans-serif;
      background: rgba(255,255,255,.72);
    }
  </style>
</head>
<body>
  <main>
    <h1>Эталон взмаха крыльев</h1>
    <p>Сначала проверяем только форму и 3D-механику исходного референса.</p>

    <div class="reference-stage">
      <div class="scale-wrap">
        <div class="butterfly_container" aria-label="Анимированная SVG-бабочка">
          <var class="rotate3d">
            <figure class="butterfly">
              <svg class="wing left" viewBox="0 0 119.744 148.477" aria-hidden="true"><use href="#shape-moth"></use></svg>
              <svg class="wing right" viewBox="0 0 119.744 148.477" aria-hidden="true"><use href="#shape-moth"></use></svg>
            </figure>
          </var>
        </div>
      </div>
    </div>

    <div class="spec"><span>60° → −70° → 60°</span><span>·</span><span>1 секунда</span><span>·</span><span>ease-in-out</span></div>
    <p class="credit">Источник: <a href="https://codepen.io/JEFworks/pen/XzKJmv">Animated SVG Butterfly — JEFworks</a></p>
  </main>
